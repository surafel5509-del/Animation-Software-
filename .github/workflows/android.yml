name: Android CI

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee unit-tests.log
      - name: Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee assemble.log
      - name: Publish compiler diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated diagnostics for $GITHUB_SHA ($GITHUB_RUN_ID)."
            echo '```text'
            grep -hE '(^e: |error:|FAILURE:|What went wrong|Compilation error|Could not|Exception|> Task .*FAILED)' unit-tests.log assemble.log 2>/dev/null | tail -250
            echo '```'
          } > ci-diagnostics.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI diagnostics: ${GITHUB_SHA::12}" --body-file ci-diagnostics.md
      - uses: actions/upload-artifact@v4
        with:
          name: animation-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
